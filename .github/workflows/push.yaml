on: [pull_request]
name: Install and Test
permissions:
  contents: read
jobs:
  test:
    name: Install & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Lint
      run: npm run lint:ci
    - name: Test
      run: npm run test
