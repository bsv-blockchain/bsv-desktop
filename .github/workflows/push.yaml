on: [pull_request]
name: Install and Test
permissions:
  contents: read
jobs:
  test:
    name: Install & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install locked dependencies for Node tests
        run: npm ci --ignore-scripts
      - name: Build native SQLite for test runtime
        run: npm rebuild better-sqlite3
      - name: Test
        run: npm test
      - name: Wallet file and recovery regressions
        run: npm run test:wallet-files
      - name: Build renderer and Electron main process
        run: npm run build
